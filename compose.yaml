name: los-angelitos-de-edgar

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Los Angelitos de Edgar}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost:8000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-perritos.Edgar}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local

x-app: &app
  image: los-angelitos-de-edgar:latest
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  environment: *app-environment
  volumes:
    - patitas_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    container_name: los-angelitos-de-edgar-app
    ports:
      - "${APP_PORT:-8000}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  queue-worker:
    <<: *app
    container_name: los-angelitos-de-edgar-queue
    stop_grace_period: 30s
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60"]

  scheduler:
    <<: *app
    container_name: los-angelitos-de-edgar-scheduler
    command: ["php", "artisan", "schedule:work"]

  migrate:
    <<: *app
    container_name: los-angelitos-de-edgar-migrate
    profiles: ["maintenance"]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]

  db:
    image: postgres:16-alpine
    container_name: los-angelitos-de-edgar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-perritos.Edgar}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - target: 5432
        published: "${DB_HOST_PORT:-5433}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - patitas_pg_data:/var/lib/postgresql/data
      - ./database/perritos_edgar_dump.sql:/docker-entrypoint-initdb.d/01-perritos-edgar.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-perritos.Edgar}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  patitas_pg_data:
    name: los_angelitos_de_edgar_pg_data
  patitas_storage:
    name: los_angelitos_de_edgar_storage
